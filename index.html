<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner productos</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
body { font-family: Arial; margin:0; background:#f3f4f6; }
.card { background:white; padding:16px; margin:10px; border-radius:10px; }
.hidden { display:none; }
button { padding:10px; border-radius:8px; border:0; margin:5px; }
.secondary { background:#ddd; }
.status { margin-top:10px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="card">
  <h2>Acceso</h2>

  <button onclick="enterGuest()">Entrar como invitado</button>

  <hr>

  <input id="userInput" placeholder="Usuario">
  <input id="passInput" type="password" placeholder="Contraseña">

  <button onclick="enterUser()">Entrar</button>
  <p id="loginError"></p>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">

<div class="card">
  <input id="searchInput" placeholder="Buscar por código o nombre">
  <button onclick="searchAndShow()">Buscar</button>
</div>

<div id="resultCard" class="card hidden">
  <h2 id="productName"></h2>
  <p id="productBarcode"></p>
  <h1 id="productPrice"></h1>

  <button id="editPriceBtn">Cambiar precio</button>
</div>

<!-- EDITAR PRECIO -->
<div id="quickPriceCard" class="card hidden">
  <h3>Cambiar precio</h3>
  <p id="quickPriceProductName"></p>

  <input id="quickPriceInput">

  <button id="saveQuickPriceBtn">Guardar</button>
  <button id="cancelQuickPriceBtn" class="secondary">Cancelar</button>
</div>

<div id="status" class="status"></div>

</div>

<script>
const SUPABASE_URL = "https://ttcyrlbgfrfsjiaxhpyy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Y3lybGJnZnJmc2ppYXhocHl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMTY3OTksImV4cCI6MjA5MjY5Mjc5OX0.cSVVmaQ2vtLZfc4aKr6yirzyaYCv3n4r4Z_5lho0Dzc";

let userRole = null;
let currentBarcode = null;

function setStatus(t){ document.getElementById("status").textContent = t; }

function enterGuest(){
  userRole="guest";
  loginScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
}

function enterUser(){
  if(userInput.value==="ALSARA" && passInput.value==="alsara22"){
    userRole="admin";
    loginScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
  } else {
    loginError.textContent="Error";
  }
}

async function supabaseFetch(path){
  const res = await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+SUPABASE_KEY
    }
  });
  return await res.json();
}

function showProduct(p){
  currentBarcode=p.barcode;
  productName.textContent=p.name;
  productBarcode.textContent=p.barcode;
  productPrice.textContent=p.price+" €";
  resultCard.classList.remove("hidden");
}

async function searchAndShow(){
  let q=searchInput.value;

  let data;

  if(/^[0-9]+$/.test(q)){
    data = await supabaseFetch("products?barcode=eq."+q);
  } else {
    data = await supabaseFetch("products?name=ilike.*"+q+"*&limit=1");
  }

  if(data.length){
    showProduct(data[0]);
  } else {
    setStatus("No encontrado");
  }
}

function openQuickPriceEditor(){
  if(userRole!=="admin"){
    setStatus("No permitido");
    return;
  }

  quickPriceCard.classList.remove("hidden");
  quickPriceProductName.textContent = productName.textContent;
  quickPriceInput.value = productPrice.textContent.replace(" €","");
}

async function saveQuickPrice(){
  let newPrice = Number(quickPriceInput.value.replace(",","."));

  if(isNaN(newPrice)){
    setStatus("Precio incorrecto");
    return;
  }

  await fetch(SUPABASE_URL+"/rest/v1/products?barcode=eq."+currentBarcode,{
    method:"PATCH",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({price:newPrice})
  });

  setStatus("Precio actualizado");
  quickPriceCard.classList.add("hidden");
  searchAndShow();
}

editPriceBtn.onclick=openQuickPriceEditor;
saveQuickPriceBtn.onclick=saveQuickPrice;
cancelQuickPriceBtn.onclick=()=>quickPriceCard.classList.add("hidden");

</script>

</body>
</html>
