}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALSARA</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background: linear-gradient(180deg, #b91c1c 0%, #dc2626 45%, #f3f4f6 45%);
}

header {
  text-align:center;
  color:white;
  padding:20px;
}

header h1 {
  font-size:40px;
  margin:0;
}

.card {
  background:white;
  margin:16px;
  padding:16px;
  border-radius:20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

input {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:18px;
}

button {
  padding:14px;
  border-radius:12px;
  border:0;
  font-weight:bold;
  font-size:16px;
}

.primary {
  background:#111;
  color:white;
}

.secondary {
  background:#eee;
}

.row {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.hidden { display:none; }

.price {
  font-size:50px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>ALSARA</h1>
</header>

<div class="card">
  <input id="searchInput" placeholder="Buscar por código o nombre">
  <div class="row">
    <button class="primary" onclick="search()">Buscar</button>
  </div>
</div>

<div id="resultCard" class="card hidden">
  <h2 id="name"></h2>
  <p id="barcode"></p>
  <div id="price" class="price"></div>

  <button class="primary" onclick="edit()">Editar</button>
</div>

<div id="editCard" class="card hidden">
  <h3>Editar producto</h3>

  <input id="editName">
  <input id="editPrice">
  <input id="editBarcode" disabled>

  <div class="row">
    <button class="primary" onclick="save()">Guardar</button>
  </div>
</div>

<script>

const URL = "https://ttcyrlbgfrfsjiaxhpyy.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // tu key

let product = null;

async function api(path){
  let r = await fetch(URL+"/rest/v1/"+path,{
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+KEY
    }
  });
  return await r.json();
}

async function search(){
  let q = searchInput.value;

  let data;

  if(/^[0-9]+$/.test(q)){
    data = await api("products?barcode=eq."+q);
  } else {
    data = await api("products?name=ilike."+q+"&limit=1");
  }

  if(data.length){
    product = data[0];

    name.textContent = product.name;
    barcode.textContent = product.barcode;
    price.textContent = product.price + " €";

    resultCard.classList.remove("hidden");
    editCard.classList.add("hidden");
  }
}

function edit(){
  editCard.classList.remove("hidden");

  editName.value = product.name;
  editPrice.value = product.price;
  editBarcode.value = product.barcode;
}

async function save(){

  let p = Number(editPrice.value.replace(",","."));

  await fetch(URL+"/rest/v1/products?barcode=eq."+product.barcode,{
    method:"PATCH",
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      name: editName.value,
      price: p
    })
  });

  editCard.classList.add("hidden");
  search();
}

</script>

</body>
</html
