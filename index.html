<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ALSARA" />
  <meta name="theme-color" content="#b91c1c" />
  <title>ALSARA</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #b91c1c 0%, #dc2626 45%, #f3f4f6 45%);
    }

    header {
      color: white;
      padding: 24px 20px 12px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 60px);
      font-weight: 950;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #fee2e2;
      font-weight: 600;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
      margin-bottom: 16px;
    }

    .login-card {
      width: min(520px, calc(100% - 32px));
      margin: 32px auto;
    }

    .scanner-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scan-frame {
      position: absolute;
      inset: 22% 12%;
      border: 4px solid rgba(255,255,255,.92);
      border-radius: 20px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.18);
      pointer-events: none;
    }

    .status {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f9fafb;
      border-radius: 14px;
      color: #374151;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 800;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input, select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px;
      font-size: 18px;
      margin-top: 6px;
      background: white;
    }

    label {
      display: block;
      font-weight: 800;
      margin-top: 14px;
    }

    .product-name {
      font-size: clamp(30px, 6vw, 54px);
      line-height: 1.05;
      margin: 6px 0;
      font-weight: 900;
    }

    .price {
      font-size: clamp(42px, 9vw, 78px);
      font-weight: 950;
      margin: 8px 0;
    }

    .muted { color: #6b7280; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <section id="loginScreen" class="card login-card">
    <h2 style="margin-top:0">Acceso</h2>
    <p class="muted">Elige cómo quieres entrar.</p>

    <button type="button" onclick="entrarInvitado()" style="width:100%; margin-top:10px">Entrar como invitado</button>

    <hr style="margin:22px 0; border:0; border-top:1px solid #e5e7eb">

    <label>
      Usuario
      <input id="userInput" autocomplete="username" placeholder="ALSARA" />
    </label>

    <label>
      Contraseña
      <input id="passInput" type="password" autocomplete="current-password" placeholder="Contraseña" />
    </label>

    <button type="button" onclick="entrarUsuario()" style="width:100%; margin-top:16px">Entrar como usuario</button>
    <p id="loginError" style="color:#991b1b; font-weight:800"></p>
  </section>

  <section id="appScreen" class="hidden">
    <header>
      <h1>ALSARA</h1>
      <p id="modeText">Escanea o busca un producto.</p>
    </header>

    <main>
      <section class="card">
        <div class="scanner-wrap">
          <video id="video" muted playsinline></video>
          <div class="scan-frame"></div>
        </div>

        <div id="status" class="status">Pulsa “Iniciar cámara” para empezar.</div>

        <div class="row" style="margin-top:12px">
          <button id="startBtn" type="button">Iniciar cámara</button>
          <button id="stopBtn" type="button" class="secondary" disabled>Parar cámara</button>
          <button id="manualBtn" type="button" class="secondary">Introducir código manual</button>
          <button id="updateBtn" type="button" class="secondary">Actualizar</button>
        </div>
      </section>

      <section class="card">
        <h2 style="margin-top:0">Buscar producto</h2>

        <label>
          Código o nombre
          <input id="searchInput" placeholder="Ej. 8412345678901 o Coca Cola" />
        </label>

        <div class="row" style="margin-top:12px">
          <button id="searchBtn" type="button">Buscar</button>
          <button id="clearSearchBtn" type="button" class="secondary">Limpiar</button>
        </div>

        <div id="searchResults" style="margin-top:14px"></div>
      </section>

      <section id="resultCard" class="card hidden">
        <div class="muted">Producto encontrado</div>
        <div id="productName" class="product-name"></div>
        <div id="productBarcode" class="muted"></div>
        <div id="productPrice" class="price"></div>

        <div class="row">
          <button id="scanAgainBtn" type="button">Escanear otro</button>
          <button id="editBtn" type="button" class="secondary">Editar</button>
        </div>
      </section>

      <section id="createCard" class="card hidden">
        <h2 id="formTitle">Crear producto</h2>
        <p class="muted">Edita los campos que quieras. Puedes borrar manualmente el contenido.</p>

        <form id="productForm">
          <label>
            Código de barras
            <input id="barcodeInput" required />
          </label>

          <label>
            Nombre del producto
            <input id="nameInput" required placeholder="Ej. Leche entera 1L" />
          </label>

          <label>
            Precio
            <input id="priceInput" required inputmode="decimal" placeholder="Ej. 1,49" />
          </label>

          <label>
            Moneda
            <select id="currencyInput">
              <option value="€">€ Euro</option>
              <option value="$">$ Dólar</option>
              <option value="£">£ Libra</option>
            </select>
          </label>

          <div class="row" style="margin-top:16px">
            <button type="button" id="saveProductBtn">Guardar producto</button>
            <button type="button" id="cancelFormBtn" class="secondary">Cancelar</button>
          </div>
        </form>
      </section>
    </main>
  </section>

  <script>
    const STORAGE_KEY = "barcode_products_v1";
    const SUPABASE_URL = "https://ttcyrlbgfrfsjiaxhpyy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Y3lybGJnZnJmc2ppYXhocHl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMTY3OTksImV4cCI6MjA5MjY5Mjc5OX0.cSVVmaQ2vtLZfc4aKr6yirzyaYCv3n4r4Z_5lho0Dzc";

    var userRole = null;
    var codeReader = null;
    var currentBarcode = null;
    var scanning = false;

    function el(id) {
      return document.getElementById(id);
    }

    function setStatus(text) {
      if (el("status")) el("status").textContent = text;
    }

    function entrarInvitado() {
      userRole = "guest";
      el("loginScreen").classList.add("hidden");
      el("appScreen").classList.remove("hidden");
      el("modeText").textContent = "Modo invitado: puedes escanear y ver productos.";
      setStatus("Modo invitado activado.");
    }

    function entrarUsuario() {
      var user = el("userInput").value.trim();
      var pass = el("passInput").value.trim();

      if (user === "ALSARA" && pass === "alsara22") {
        userRole = "admin";
        el("loginError").textContent = "";
        el("loginScreen").classList.add("hidden");
        el("appScreen").classList.remove("hidden");
        el("modeText").textContent = "Modo usuario ALSARA: puedes escanear, crear y editar productos.";
        setStatus("Modo usuario ALSARA activado.");
      } else {
        el("loginError").textContent = "Usuario o contraseña incorrectos.";
      }
    }

    function loadProducts() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveLocalProduct(product) {
      var products = loadProducts();
      products[product.barcode] = product;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function normalizePrice(value) {
      return String(value).trim().replace(",", ".");
    }

    function money(product) {
      var price = Number(product.price);
      var currency = product.currency || "€";
      if (Number.isNaN(price)) return product.price + " " + currency;
      return price.toFixed(2).replace(".", ",") + " " + currency;
    }

    function hidePanels() {
      el("resultCard").classList.add("hidden");
      el("createCard").classList.add("hidden");
    }

    function showProduct(product) {
      hidePanels();
      currentBarcode = product.barcode;

      saveLocalProduct(product);

      el("productName").textContent = product.name;
      el("productBarcode").textContent = "Código: " + product.barcode;
      el("productPrice").textContent = money(product);
      el("resultCard").classList.remove("hidden");

      setStatus("Producto encontrado.");
    }

    function showCreateForm(barcode, product) {
      if (userRole === "guest") {
        hidePanels();
        setStatus("Producto no encontrado. Modo invitado: no puedes crear productos.");
        return;
      }

      hidePanels();
      currentBarcode = barcode;

      el("barcodeInput").value = product ? product.barcode : barcode;
      el("nameInput").value = product ? product.name : "";
      el("priceInput").value = product ? product.price : "";
      el("currencyInput").value = product && product.currency ? product.currency : "€";

      el("formTitle").textContent = product ? "Editar producto" : "Crear producto";
      el("createCard").classList.remove("hidden");

      setStatus(product ? "Edita los campos que quieras." : "Producto no encontrado. Puedes crearlo.");
    }

    async function supabaseFetch(path, options) {
      options = options || {};
      var headers = options.headers || {};

      headers.apikey = SUPABASE_KEY;
      headers.Authorization = "Bearer " + SUPABASE_KEY;
      headers["Content-Type"] = "application/json";

      if (!headers.Prefer) headers.Prefer = "return=representation";

      var res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
        method: options.method || "GET",
        headers: headers,
        body: options.body
      });

      if (!res.ok) {
        var errorText = await res.text();
        throw new Error(errorText || "Error Supabase " + res.status);
      }

      if (res.status === 204) return [];
      return await res.json();
    }

    async function getProductFromSupabase(barcode) {
      var data = await supabaseFetch(
        "products?barcode=eq." + encodeURIComponent(barcode) + "&select=barcode,name,price,currency"
      );
      return data[0] || null;
    }

    async function searchProductsFromSupabase(query) {
      var q = String(query || "").trim();
      if (!q) return [];

      if (/^[0-9]+$/.test(q)) {
        return await supabaseFetch(
          "products?select=barcode,name,price,currency&barcode=eq." +
          encodeURIComponent(q) +
          "&limit=20"
        );
      }

      return await supabaseFetch(
        "products?select=barcode,name,price,currency&name=ilike.*" +
        encodeURIComponent(q) +
        "*&order=name.asc&limit=20"
      );
    }

    async function saveProductToSupabase(product) {
      var data = await supabaseFetch("products?on_conflict=barcode", {
        method: "POST",
        headers: {
          Prefer: "resolution=merge-duplicates,return=representation"
        },
        body: JSON.stringify(product)
      });

      return data[0] || product;
    }

    function renderSearchResults(products) {
      var box = el("searchResults");
      box.innerHTML = "";

      if (!products || products.length === 0) {
        box.innerHTML = '<div class="status">No se ha encontrado ningún producto.</div>';
        return;
      }

      for (var i = 0; i < products.length; i++) {
        (function(product) {
          var div = document.createElement("div");
          div.className = "status";
          div.style.cursor = "pointer";
          div.innerHTML =
            "<strong>" + product.name + "</strong><br>" +
            "Código: " + product.barcode + "<br>" +
            "Precio: " + money(product);

          div.onclick = function() {
            showProduct(product);
          };

          box.appendChild(div);
        })(products[i]);
      }
    }

    async function handleBarcode(code) {
      var barcode = String(code).trim();
      if (!barcode) return;

      currentBarcode = barcode;
      hidePanels();
      setStatus("Buscando producto…");

      try {
        var product = await getProductFromSupabase(barcode);

        if (product) {
          showProduct(product);
        } else {
          showCreateForm(barcode, null);
        }
      } catch (error) {
        console.error(error);
        setStatus("Error buscando en Supabase: " + error.message);
      }
    }

    async function searchAndShow(query) {
      var q = String(query || "").trim();

      if (!q) {
        setStatus("Escribe un código o nombre para buscar.");
        return;
      }

      hidePanels();
      setStatus("Buscando: " + q + "…");

      try {
        var results = await searchProductsFromSupabase(q);
        renderSearchResults(results);

        if (results.length === 1) {
          showProduct(results[0]);
        } else if (results.length > 1) {
          setStatus("Productos encontrados: " + results.length + ". Toca uno para verlo.");
        } else {
          if (/^[0-9]+$/.test(q)) {
            showCreateForm(q, null);
          } else {
            setStatus("No se ha encontrado ningún producto con ese nombre.");
          }
        }
      } catch (error) {
        console.error(error);
        setStatus("Error buscando en Supabase: " + error.message);
      }
    }

    async function startScanner() {
      hidePanels();
      setStatus("Solicitando acceso a la cámara…");

      try {
        codeReader = new ZXing.BrowserMultiFormatReader();
        scanning = true;
        el("startBtn").disabled = true;
        el("stopBtn").disabled = false;

        var constraints = {
          video: {
            facingMode: { ideal: "environment" }
          }
        };

        setStatus("Escaneando… apunta al código de barras.");

        codeReader.decodeFromConstraints(constraints, el("video"), function(result, error) {
          if (result && scanning) {
            if (navigator.vibrate) navigator.vibrate(120);
            stopScanner();
            handleBarcode(result.text);
          }
        });
      } catch (error) {
        console.error(error);
        setStatus("No se pudo iniciar la cámara. Revisa permisos o usa HTTPS/Safari.");
        el("startBtn").disabled = false;
        el("stopBtn").disabled = true;
      }
    }

    function stopScanner() {
      scanning = false;

      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }

      el("startBtn").disabled = false;
      el("stopBtn").disabled = true;
    }

    async function saveProductFromForm() {
      if (userRole !== "admin") {
        setStatus("Modo invitado: no puedes guardar productos.");
        return;
      }

      var barcode = el("barcodeInput").value.trim();
      var name = el("nameInput").value.trim();
      var priceText = normalizePrice(el("priceInput").value);
      var currency = el("currencyInput").value;

      if (!barcode || !name || !priceText) {
        setStatus("Rellena todos los campos.");
        return;
      }

      var priceNumber = Number(priceText);

      if (Number.isNaN(priceNumber)) {
        setStatus("El precio no es válido. Ejemplo correcto: 1,50");
        return;
      }

      var product = {
        barcode: barcode,
        name: name,
        price: priceNumber,
        currency: currency
      };

      el("saveProductBtn").disabled = true;
      saveLocalProduct(product);
      showProduct(product);
      setStatus("Guardando en Supabase…");

      try {
        var saved = await saveProductToSupabase(product);
        showProduct(saved);
        setStatus("Producto guardado correctamente.");
      } catch (error) {
        console.error(error);
        setStatus("Guardado solo en esta página. Supabase falló: " + error.message);
      } finally {
        el("saveProductBtn").disabled = false;
      }
    }

    function setupButtons() {
      el("startBtn").onclick = startScanner;

      el("stopBtn").onclick = function() {
        stopScanner();
        setStatus("Cámara parada.");
      };

      el("updateBtn").onclick = function() {
        setStatus("Actualizado. Busca o escanea un producto.");
      };

      el("manualBtn").onclick = function() {
        var query = prompt("Introduce código de barras o nombre del producto:");
        if (query) searchAndShow(query);
      };

      el("searchBtn").onclick = function() {
        searchAndShow(el("searchInput").value);
      };

      el("searchInput").onkeydown = function(event) {
        if (event.key === "Enter") searchAndShow(el("searchInput").value);
      };

      el("clearSearchBtn").onclick = function() {
        el("searchInput").value = "";
        el("searchResults").innerHTML = "";
        hidePanels();
        setStatus("Búsqueda limpiada.");
      };

      el("scanAgainBtn").onclick = startScanner;

      el("editBtn").onclick = async function() {
        if (userRole === "guest") {
          setStatus("Modo invitado: no puedes editar productos.");
          return;
        }

        if (!currentBarcode) return;

        var product = loadProducts()[currentBarcode];

        if (!product) {
          try {
            product = await getProductFromSupabase(currentBarcode);
            if (product) saveLocalProduct(product);
          } catch (error) {
            console.error(error);
          }
        }

        if (product) {
          showCreateForm(currentBarcode, product);
          setStatus("Edita los campos que quieras y borra manualmente lo que necesites.");
        } else {
          setStatus("No se pudo cargar el producto para editar.");
        }
      };

      el("saveProductBtn").onclick = saveProductFromForm;

      el("cancelFormBtn").onclick = function() {
        hidePanels();
        setStatus("Formulario cancelado.");
      };

      el("productForm").onsubmit = function(event) {
        event.preventDefault();
        saveProductFromForm();
      };

      el("passInput").onkeydown = function(event) {
        if (event.key === "Enter") entrarUsuario();
      };
    }

    setupButtons();
  </script>
</body>
</html>
